[package]
name = "bootrom-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
lanes4 = []
lanes2 = []
typec = []
# Bring-up measurement aid: park the HD3SS460 control pins released
# (EN/POL/AMSEL all Hi-Z -> board pull-ups) right after boot and halt.
muxpark = []
# Board bring-up profile (Tang Primer 25K + Pmod DP): selects a monitor-
# viable 800x600@60 video configuration instead of the small simulation
# frame. Build via `make bootrom-rs-board.hex`.
board = []

[dependencies]
bootrom-pac = {path = "./pac", features = ["critical-section"]}
riscv = { version = "0.10.1", features = ["critical-section-single-hart"]}
embedded-hal = "=1.0.0-alpha.11"
heapless = "0.7"
embedded-hal-nb = "1.0.0-alpha.3"
nb = "1.1.0"
portable-atomic = { version = "1.4.2", features = ["critical-section"] }
no_std_io = "0.6.0"
