[project]
name    = "eth100phy"
version = "0.1.0"

[build]
clock_type          = "posedge"
reset_type          = "sync_high"
omit_project_prefix = true

[test]
include_files = [
    "../oscdr/os_cdr.sv",
    "test/eth100_chan.sv",
    "test/eth100_link_body.sv",
]

[test.verilator]
compile_args = [
    "os_cdr.sv",
    "eth100_chan.sv",
    "eth100_link_body.sv",
    "-Wno-WIDTHEXPAND",
    "-Wno-WIDTHTRUNC",
    "-Wno-CASEINCOMPLETE",
    "-Wno-UNUSEDSIGNAL",
    "-Wno-UNDRIVEN",
    "-Wno-PINMISSING",
    "-Wno-INITIALDLY",
    "-Wno-TIMESCALEMOD",
    "-Wno-UNUSEDPARAM",
    "-Wno-REALCVT",
    "-Wno-UNSIGNED",
]
