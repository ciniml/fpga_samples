[package]
name = "serial-bridge"
version = "0.1.0"
edition = "2021"
description = "Serial-port bridge web server for the FPGA host UIs (BERT / trace viewer)"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
